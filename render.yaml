services:
  - type: web
    name: mentor-surveys-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: GROQ_API_KEY
        fromService:
          name: mentor-surveys
          type: secret
          property: GROQ_API_KEY
    plan: free
